<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Arena Overlay</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/shell-overlay.css">
</head>
<body class="is-loading">

<!-- Оверлей эфира. В OBS: Browser Source 1920×1080, адрес overlay.html?obs=1,
     галочка «Управлять звуком через OBS» — звук рекламы и фраз героев идёт отсюда.

     Внутри — HUD обеих игр (каждый в своей рамке, со своими стилями), показывается
     тот, что выбран на пульте. Поверх них — анимация пика и реклама. -->

<iframe class="game" id="frameDota" data-game="dota" title="HUD Dota 2" tabindex="-1"></iframe>
<iframe class="game" id="frameCs2" data-game="cs2" title="HUD CS2" tabindex="-1"></iframe>

<!-- Анимация пика героя -->
<div class="pickfx" id="pickfx" aria-hidden="true">
  <div class="pickfx__card" id="pickCard">
    <div class="pickfx__media">
      <div class="pickfx__img" id="pickImg"></div>
      <video class="pickfx__video" id="pickVideo" muted playsinline preload="auto"></video>
      <div class="pickfx__shine"></div>
    </div>
    <div class="pickfx__text">
      <div class="pickfx__eyebrow"><span id="pickTeam">Radiant</span><i></i><span id="pickNum">пик</span></div>
      <div class="pickfx__hero" id="pickHero">Hero</div>
    </div>
    <div class="pickfx__sparks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <audio id="pickVoice" preload="auto"></audio>
</div>

<!-- Реклама: ролик и переход поверх всего -->
<div class="ads" id="ads" aria-hidden="true">
  <video class="ads__clip" id="adClipA" playsinline preload="auto"></video>
  <video class="ads__clip" id="adClipB" playsinline preload="auto"></video>
  <video class="ads__transition" id="adTransition" playsinline preload="auto"></video>
</div>

<div class="conn" id="conn">нет связи с сервером</div>

<script src="js/dota.js"></script>
<script src="js/shell-overlay.js"></script>
</body>
</html>
